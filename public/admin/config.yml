# Decap CMS configuration — the visual editor at /admin
#
# HOW IT WORKS: an editor signs in with GitHub, edits a form, clicks Publish.
# Decap commits the change to the repository below; Cloudflare Pages rebuilds and
# the live site updates in a minute or two. There is no separate database.
#
# SETUP (once, by the webmaster): set `repo` to the board-owned repository, and
# register a GitHub OAuth app so editors can sign in. Cloudflare Pages does not
# host the OAuth handshake itself; use a small OAuth proxy (e.g. a Cloudflare
# Worker running decap-proxy) and set `base_url`/`auth_endpoint` below accordingly.
# See README.md → "Editing the site".

backend:
  name: github
  repo: chequamegon-symphony/website   # TODO: board-owned org/repo
  branch: main
  # base_url: https://auth.chequamegonsymphony.org   # OAuth proxy, once deployed
  # auth_endpoint: auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: season
    label: "Concert Season"
    files:
      - name: season
        label: "Current Season"
        file: "src/data/season.json"
        fields:
          - { label: "Season title", name: seasonTitle, widget: string, hint: "e.g. 2026–27 Concert Series" }
          - { label: "Season theme", name: seasonTheme, widget: string, required: false }
          - label: "Concerts"
            name: concerts
            widget: list
            fields:
              - { label: "Name", name: name, widget: string, hint: "Fall / Winter / Spring" }
              - { label: "Concert title", name: title, widget: string }
              - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Date (as shown)", name: dateDisplay, widget: string, hint: "e.g. Saturday, November 7, 2026" }
              - { label: "Time", name: time, widget: string }
              - { label: "Venue", name: venue, widget: string }
              - label: "Program"
                name: program
                widget: list
                fields:
                  - { label: "Work", name: work, widget: string }
                  - { label: "Composer", name: composer, widget: string }

  - name: pages
    label: "Pages"
    folder: "src/content/pages"
    create: false
    delete: false
    extension: md
    format: frontmatter
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Header image", name: image, widget: image, required: false }
      - { label: "Header image description", name: imageAlt, widget: string, required: false }
      - { label: "Body", name: body, widget: markdown }

  - name: site
    label: "Site Details"
    files:
      - name: site
        label: "Contact, donations, sponsors"
        file: "src/data/site.json"
        fields:
          - { label: "Orchestra name", name: name, widget: string }
          - { label: "Short name", name: shortName, widget: string }
          - { label: "Tagline", name: tagline, widget: string }
          - { label: "Email", name: email, widget: string }
          - { label: "Facebook URL", name: facebook, widget: string }
          - label: "Donations"
            name: donations
            widget: object
            fields:
              - { label: "Intro", name: intro, widget: string }
              - { label: "Payee", name: payee, widget: string }
              - { label: "Address lines", name: address, widget: list, field: { label: "Line", name: line, widget: string } }
          - label: "Concert reminder sign-up"
            name: reminderForm
            widget: object
            fields:
              - { label: "Intro", name: intro, widget: string }
              - { label: "Form URL", name: url, widget: string }
              - { label: "Button text", name: buttonText, widget: string }
          - label: "Sponsors"
            name: sponsors
            widget: list
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Logo", name: image, widget: image }
              - { label: "Website", name: url, widget: string, required: false }
