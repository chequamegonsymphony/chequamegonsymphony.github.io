# Build check on every pull request and push. Deployment is NOT done here —
# Cloudflare Pages is connected directly to the repository and builds `main` itself.
# This workflow exists so a broken change is caught in the PR, before it reaches main.
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
